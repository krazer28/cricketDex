<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>My XI - CricketDex</title>

<link rel="stylesheet"
href="myxi.css">


<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1387397726488435"
     crossorigin="anonymous"></script>
</head>

<body>
<!-- AdSense vertical sidebar: left -->
<aside class="cricketdex-side-ad cricketdex-side-ad-left" aria-label="Advertisement">
  <ins class="adsbygoogle"
       style="display:inline-block;width:360px;height:800px"
       data-ad-client="ca-pub-1387397726488435"
       data-ad-slot="1384996092"></ins>
</aside>
<script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
<!-- AdSense vertical sidebar: right -->
<aside class="cricketdex-side-ad cricketdex-side-ad-right" aria-label="Advertisement">
  <ins class="adsbygoogle"
       style="display:inline-block;width:360px;height:800px"
       data-ad-client="ca-pub-1387397726488435"
       data-ad-slot="7714153619"></ins>
</aside>
<script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

<button class="back-btn"
     onclick="history.back()" id="back">

               ← Back

            </button>

<div class="xi-wrap">

    <h1 class="xi-title">MY XI</h1>

    <p class="xi-sub" id="xiCount">0 / 11 players</p>

    <div class="xi-warnings"
    id="xiWarnings"></div>

    <div class="xi-search">

        <input type="text"
        id="xiSearchBox"
        placeholder="Search a player to add...">

        <div class="suggestions"
        id="xiSuggestions"></div>

    </div>

    <!-- AdSense: My XI below search -->
<div class="cricketdex-ad" aria-label="Advertisement">
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-1387397726488435"
       data-ad-slot="8376498599"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
</div>
<script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

    <div class="xi-grid"
    id="xiGrid"></div>

    <div class="xi-empty"
    id="xiEmpty">

        No players in your XI yet. Search above to add one.

    </div>

    <!-- AdSense: My XI below selected team -->
<div class="cricketdex-ad" aria-label="Advertisement">
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-1387397726488435"
       data-ad-slot="8376498599"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
</div>
<script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

</div>

<script src="players.js"></script>
