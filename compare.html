<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Compare - CricketDex</title>

<link rel="stylesheet"
href="compare.css">


<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1387397726488435"
     crossorigin="anonymous"></script>
</head>

<body>
<!-- AdSense vertical sidebar: left -->
<aside class="cricketdex-side-ad cricketdex-side-ad-left" aria-label="Advertisement">
  <ins class="adsbygoogle"
       style="display:inline-block;width:360px;height:800px"
       data-ad-client="ca-pub-1387397726488435"
       data-ad-slot="1384996092"></ins>
</aside>
<script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
<!-- AdSense vertical sidebar: right -->
<aside class="cricketdex-side-ad cricketdex-side-ad-right" aria-label="Advertisement">
  <ins class="adsbygoogle"
       style="display:inline-block;width:360px;height:800px"
       data-ad-client="ca-pub-1387397726488435"
       data-ad-slot="7714153619"></ins>
</aside>
<script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

<button class="back-btn"
     onclick="history.back()" id="back">

               ← Back

            </button>

<div class="compare-wrap">

    <h1 class="compare-title">COMPARE</h1>
<!-- AdSense: compare top -->
<div class="cricketdex-ad" aria-label="Advertisement">
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-1387397726488435"
       data-ad-slot="3005199525"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
</div>
<script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

    <div class="picker-row">

        <div class="picker" id="pickerA">

            <input type="text"
            id="searchA"
            placeholder="Search player A...">

            <div class="suggestions"
            id="suggestionsA"></div>

            <div class="picked-card"
            id="pickedA"></div>

        </div>

        <div class="vs-label">VS</div>

        <div class="picker" id="pickerB">

            <input type="text"
            id="searchB"
            placeholder="Search player B...">

            <div class="suggestions"
            id="suggestionsB"></div>

            <div class="picked-card"
            id="pickedB"></div>

        </div>

    </div>

    <button id="startCompareBtn"
    class="compare-btn" disabled>

        Compare

    </button>

    <div class="scoreboard"
    id="scoreboard">

        <span class="score-name"
        id="scoreNameA"></span>

        <span class="score-val"
        id="scoreValA">0</span>

        <span class="score-dash">-</span>

        <span class="score-val"
        id="scoreValB">0</span>

        <span class="score-name"
        id="scoreNameB"></span>

    </div>

    <div class="stat-rows"
    id="statRows"></div>

    <div class="result-banner"
    id="resultBanner"></div>

    <!-- AdSense: compare results bottom -->
<div class="cricketdex-ad" aria-label="Advertisement">
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-1387397726488435"
       data-ad-slot="3005199525"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
</div>
<script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

</div>

<script src="players.js"></script>

<script src="compare.js"></script>

</body>

</html>
